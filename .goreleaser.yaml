# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: mva

before:
  hooks:
    - go mod tidy

builds:
  - id: mva
    main: ./cmd/mva
    binary: mva
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS.txt"
  algorithm: sha256

release:
  name_template: "v{{ .Version }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge"
      - "^docs?"
